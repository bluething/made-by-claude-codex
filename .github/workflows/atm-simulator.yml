name: atm-simulator

on:
  push:
    paths:
      - "atm-simulator/**"
      - ".github/workflows/atm-simulator.yml"
  pull_request:
    paths:
      - "atm-simulator/**"
      - ".github/workflows/atm-simulator.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: atm-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify (compile, tests, architecture rules, coverage gate)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Smoke test start.sh with the example session
        run: ./scripts/smoke-test.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: atm-simulator/target/site/jacoco
          if-no-files-found: ignore
